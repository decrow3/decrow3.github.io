<figure class="figure-panel">
  <div class="panel-grid">
    <div class="panel">
      <svg viewBox="0 0 220 150" role="img" aria-label="Circuit A: three inputs converge directly on one output neuron.">
        <defs><marker id="fc-a-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.2 L9 5 L0 8.8 Z" class="fig-fill-ink"/></marker></defs>
        <g class="fig-wire" marker-end="url(#fc-a-arrow)">
          <path d="M46 34 C100 34 118 70 160 72"/><path d="M46 75 H159"/><path d="M46 116 C100 116 118 80 160 78"/>
        </g>
        <g class="fig-cell"><circle cx="36" cy="34" r="10"/><circle cx="36" cy="75" r="10"/><circle cx="36" cy="116" r="10"/></g>
        <circle class="fig-cell--out" cx="176" cy="75" r="15"/>
        <text class="fig-axis" x="36" y="145" text-anchor="middle">inputs</text>
        <text class="fig-axis" x="176" y="112" text-anchor="middle">output</text>
      </svg>
      <p><strong>Circuit A</strong> Feedforward pooling of inputs.</p>
    </div>
    <div class="panel">
      <svg viewBox="0 0 220 150" role="img" aria-label="Circuit B: the same inputs reach the output neuron through direct connections, an inhibitory interneuron, and a recurrent loop.">
        <defs>
          <marker id="fc-b-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 1.2 L9 5 L0 8.8 Z" class="fig-fill-ink"/></marker>
          <marker id="fc-b-inh" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7"><circle cx="5" cy="5" r="4" class="fig-fill-warm"/></marker>
        </defs>
        <g class="fig-wire" marker-end="url(#fc-b-arrow)">
          <path d="M46 34 C100 34 118 70 160 72"/><path d="M46 75 H159"/>
          <path d="M45 80 C70 92 80 108 100 113"/><path d="M46 116 H99"/>
          <path d="M186 63 C212 26 150 22 169 60"/>
        </g>
        <path class="fig-wire fig-wire--inh" d="M122 112 C146 108 158 100 166 88" marker-end="url(#fc-b-inh)"/>
        <g class="fig-cell"><circle cx="36" cy="34" r="10"/><circle cx="36" cy="75" r="10"/><circle cx="36" cy="116" r="10"/></g>
        <circle class="fig-cell--inh" cx="112" cy="116" r="10"/>
        <circle class="fig-cell--out" cx="176" cy="75" r="15"/>
        <text class="fig-axis" x="36" y="145" text-anchor="middle">inputs</text>
        <text class="fig-axis" x="112" y="145" text-anchor="middle">inhibitory</text>
        <text class="fig-axis" x="176" y="112" text-anchor="middle">output</text>
      </svg>
      <p><strong>Circuit B</strong> Pooling shaped by inhibition and recurrence.</p>
    </div>
    <div class="panel panel--result">
      <svg viewBox="0 0 220 150" role="img" aria-label="A single tuning curve: both circuits produce the same response to the stimulus.">
        <path class="fig-axisline" d="M34 16 V122 H206"/>
        <path class="fig-curve" d="M40 119 C86 119 92 30 120 30 C148 30 154 119 200 119"/>
        <path class="fig-curve fig-curve--b" d="M40 119 C86 119 92 30 120 30 C148 30 154 119 200 119"/>
        <text class="fig-axis" x="120" y="141" text-anchor="middle">stimulus</text>
        <text class="fig-axis" x="18" y="69" text-anchor="middle" transform="rotate(-90 18 69)">response</text>
        <text class="fig-axis" x="150" y="46">A = B</text>
      </svg>
      <p><strong>Same response</strong> Hard to tell A from B from responses alone.</p>
    </div>
  </div>
  <figcaption><span class="fig-num">Fig. 1</span><span class="fig-kind">Illustrative schematic</span> Different circuits can produce the same tuning, which is why neural responses are combined with circuit models and perturbations.</figcaption>
</figure>
